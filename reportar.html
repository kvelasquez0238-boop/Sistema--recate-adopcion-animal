<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar animal rescatado</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f0fa;
            color: #333333;
        }

        header {
            background-color: #673ab7;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #4527a0;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
        }

        section {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h2 {
            color: #673ab7;
        }

        input, select, textarea {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #b39ddb;
            border-radius: 5px;
        }

        button {
            background-color: #673ab7;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #4527a0;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Reportar animal rescatado</h1>
        <p>Registra un nuevo caso de rescate animal.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="reportar.html">Reportar animal</a>
        <a href="rescates.html">Lista de rescates</a>
    </nav>

    <main>
        <section>
            <h2>Formulario de rescate</h2>

            <form action="#" method="post">

                <label for="nombre">Nombre provisional del animal:</label><br>
                <input type="text" id="nombre" name="nombre" required>
                <br><br>

                <label for="categoria">Categoría del animal:</label><br>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="perros">Perros</option>
                    <option value="gatos">Gatos</option>
                    <option value="fauna-silvestre">Fauna Silvestre</option>
                </select>
                <br><br>

                <p>Urgencia del rescate:</p>

                <input type="radio" id="alta" name="urgencia" value="Alta" required>
                <label for="alta">Alta</label><br>

                <input type="radio" id="media" name="urgencia" value="Media">
                <label for="media">Media</label><br>

                <input type="radio" id="baja" name="urgencia" value="Baja">
                <label for="baja">Baja</label>
                <br><br>

                <label for="descripcion">Descripción del estado del animal:</label><br>
                <textarea id="descripcion" name="descripcion" rows="5" cols="40" required></textarea>
                <br><br>

                <button type="submit">Registrar rescate</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Actividad 3 - Desarrollo de Sistemas Informáticos</p>
    </footer>

</body>
</html>
